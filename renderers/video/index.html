<!doctype html>
<!--
    Video-ul de prezentare al unui repository (HyperFrames 0.9.29): 1080×1920, 30 de cadre pe secundă.

    Scena e pagina REALĂ de GitHub a repository-ului, fotografiată de renderers/capture/github.mjs exact la
    lățimea video-ului (1080 px): fiecare pixel al fotografiei e un pixel al video-ului, fără mărire sau
    micșorare, iar camera doar derulează, oprindu-se mereu pe un pixel întreg — de aceea textul rămâne clar.
    Camera merge de la un reper la altul și luminează discret elementul despre care vorbește vocea (numele,
    descrierea, logo-ul, titlul din README, stelele, contribuitorii, comanda de instalare).
    Peste pagină stau doar: bara de progres (un segment pe scenă), identitatea repository-ului (avatarul
    proprietarului și numele), capitolul poveștii și, în banda de jos, subtitrarea — câteva cuvinte odată,
    cu cel rostit evidențiat. Cardurile bleumarin arată date care NU sunt pe pagina de GitHub (analiza
    codului, istoricul git). GitChronicle apare doar ca o mențiune mică, la final.

    Când pagina nu a putut fi fotografiată (data.capture e null), aceeași compoziție desenează scene
    tipografice pe fundal bleumarin: textul mare ține locul paginii.

    Toate textele și pozițiile vin din datele trimise la randare (`hyperframes render` cu opțiunea variables-file), citite
    cu window.__hyperframes.getVariables(). Textele ajung în pagină doar cu textContent: vin dintr-un
    repository străin, deci nu au voie să devină HTML. Fără date, video-ul rămâne gol: nu există texte de probă.

    Durata totală (data-duration de pe #root) o scrie VideoRenderer în copia de lucru a șablonului.
    Totul depinde doar de timpul timeline-ului (fără ceas, fără Math.random), deci randarea e mereu aceeași.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="stylesheet" href="assets/fonts.css">
    <style>
        :root {
            /* Pagina de GitHub își aduce culorile ei; ale noastre sunt doar trei: bleumarinul și argintiul
               GitChronicle și galbenul de marker (galbenul din paleta GitHub), singurul accent. */
            --ink: #f3f5fb;
            --muted: #a3acc2;
            --silver: #c9cfdd;
            --navy-0: #060914;
            --navy-1: #0b1226;
            --navy-2: #131d3b;
            --marker: #ffd33d;
            --accent: #8f9cff;
            --accent-strong: #5b67e0;
            --github: #0d1117;
            --sans: 'Instrument Sans', sans-serif;
            --brand: 'Mona Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { width: 1080px; height: 1920px; background: var(--navy-0); overflow: hidden; }

        #root {
            position: relative;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        .layer { position: absolute; inset: 0; }

        /* ===================== Scena: pagina de GitHub ===================== */

        #stage { background: var(--github); overflow: hidden; }

        /*
         * Pagina întreagă, în pixelii video-ului: bucățile fotografiei la mărimea lor naturală (1:1). „Camera”
         * doar o mută pe verticală. Fără will-change și fără scale: altfel Chrome desenează pagina o dată,
         * mai mică, și apoi o întinde — exact asta făcea video-ul neclar.
         */
        #page { position: absolute; left: 0; top: 0; }

        #page img.tile { position: absolute; left: 0; display: block; }

        /* Lumina discretă pe elementul real: o margine caldă, iar restul paginii se întunecă puțin. */
        .frame {
            position: absolute;
            border: 4px solid rgb(255 211 61 / 0.9);
            border-radius: 18px;
            box-shadow: 0 0 0 4000px rgb(1 4 9 / 0.42), 0 0 40px rgb(255 211 61 / 0.3);
            opacity: 0;
        }

        /* Sus: un văl întunecat sub identitate. Jos: banda subtitrării, cu marginea topită în pagină. */
        #top-scrim {
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 300px;
            background: linear-gradient(180deg, rgb(1 4 9 / 0.97) 0%, rgb(1 4 9 / 0.94) 78%, rgb(1 4 9 / 0) 100%);
        }

        #band {
            position: absolute;
            left: 0; right: 0; top: 1140px; bottom: 0;
            background: linear-gradient(180deg, rgb(4 7 15 / 0) 0%, rgb(4 7 15 / 0.9) 18%, rgb(4 7 15 / 0.93) 60%, rgb(4 7 15 / 0.98) 100%);
        }

        /* Bara de progres: un segment pe scenă. */
        #progress { position: absolute; left: 56px; right: 56px; top: 70px; display: flex; gap: 8px; }

        .segment { position: relative; flex: 1; height: 6px; border-radius: 3px; background: rgb(243 245 251 / 0.24); overflow: hidden; }

        .segment-fill { position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; }

        /* Identitatea repository-ului, mereu pe ecran: avatarul proprietarului și numele. */
        #identity { position: absolute; left: 56px; top: 104px; display: flex; align-items: center; gap: 20px; max-width: 968px; }

        #avatar { width: 76px; height: 76px; border-radius: 50%; flex: none; background: var(--navy-2); box-shadow: 0 0 0 3px rgb(201 207 221 / 0.3); object-fit: cover; }

        #repo-name { font-family: var(--brand); font-weight: 700; font-size: 40px; letter-spacing: -0.01em; white-space: nowrap; }

        #repo-name .owner { color: var(--muted); }

        /* Capitolul poveștii: ce parte a prezentării e pe ecran. */
        #chapters { position: absolute; left: 56px; right: 56px; top: 206px; height: 48px; }

        .chapter {
            position: absolute; left: 0; top: 0;
            display: flex; align-items: center; gap: 14px;
            font-family: var(--brand); font-weight: 700; font-size: 31px; color: var(--silver);
            white-space: nowrap; opacity: 0;
        }

        .chapter::before { content: ''; width: 12px; height: 12px; border-radius: 3px; background: var(--marker); flex: none; }

        .chapter .count { color: var(--muted); font-weight: 700; }

        /* Unde suntem în pagină: o bară subțire în dreapta, ca la derularea pe telefon. */
        #scroll-track { position: absolute; right: 18px; top: 330px; width: 6px; height: 800px; border-radius: 3px; background: rgb(243 245 251 / 0.14); }

        #scroll-thumb { position: absolute; left: 0; top: 0; width: 6px; border-radius: 3px; background: rgb(243 245 251 / 0.75); }

        /* Subtitrarea: o frază odată, centrată în bandă; cuvântul rostit e galben. */
        #captions { position: absolute; left: 96px; right: 96px; top: 1290px; height: 260px; }

        .cue {
            position: absolute; left: 0; right: 0; top: 0; height: 260px;
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap; align-content: center;
            column-gap: 0.26em; row-gap: 0;
            font-family: var(--brand); font-weight: 900; font-size: 74px; line-height: 1.16; letter-spacing: -0.015em;
            text-align: center; opacity: 0;
        }

        .cue .word { display: inline-block; color: var(--ink); text-shadow: 0 3px 0 rgb(4 7 15 / 0.9), 0 6px 26px rgb(0 0 0 / 0.85); }

        /* Cardurile bleumarin: date din analiza și istoricul făcute de GitChronicle, nu de pe pagina de GitHub. */
        .card {
            position: absolute; left: 56px; right: 56px;
            padding: 34px 40px 30px;
            border-radius: 30px;
            background: rgb(11 18 38 / 0.96);
            box-shadow: inset 0 0 0 2px rgb(201 207 221 / 0.2), 0 30px 80px rgb(0 0 0 / 0.55);
            opacity: 0;
        }

        .card-note { margin-top: 22px; font-weight: 600; font-size: 26px; color: var(--muted); }

        .chips { display: flex; flex-wrap: wrap; gap: 16px; }

        .chip {
            padding: 12px 26px; border-radius: 999px;
            background: rgb(243 245 251 / 0.08); box-shadow: inset 0 0 0 2px rgb(201 207 221 / 0.26);
            font-family: var(--brand); font-weight: 700; font-size: 38px; white-space: nowrap;
        }

        .modules { display: flex; flex-direction: column; gap: 8px; font-family: var(--mono); font-weight: 500; font-size: 36px; line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }

        .modules span::before { content: '▸ '; color: var(--marker); }

        .stats { display: flex; gap: 28px; }

        .stat { flex: 1; min-width: 0; }

        .stat-value { font-family: var(--brand); font-weight: 900; font-size: 68px; line-height: 1.05; letter-spacing: -0.02em; white-space: nowrap; }

        .stat-label { margin-top: 6px; font-weight: 600; font-size: 28px; color: var(--muted); }

        /*
         * Finalul: pagina se întunecă și rămâne repository-ul — imaginea lui (previzualizarea proprie sau
         * logo-ul din README), avatarul proprietarului, numele și adresa. Dedesubt, mic, mențiunea GitChronicle.
         */
        #dim { background: rgb(1 4 9 / 0.86); opacity: 0; }

        #closing { position: absolute; left: 56px; right: 56px; top: 360px; opacity: 0; }

        #closing .hero { display: block; max-width: 968px; max-height: 484px; margin: 0 auto 56px; border-radius: 30px; object-fit: contain; box-shadow: 0 0 0 2px rgb(201 207 221 / 0.22), 0 40px 100px rgb(0 0 0 / 0.6); }

        #closing .where { display: flex; align-items: center; gap: 28px; }

        #closing .where img { width: 132px; height: 132px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px rgb(201 207 221 / 0.3); }

        #closing .where b { display: block; font-family: var(--brand); font-weight: 900; font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; overflow-wrap: anywhere; }

        #closing .where span { display: block; margin-top: 10px; font-family: var(--mono); font-weight: 500; font-size: 32px; color: var(--silver); overflow-wrap: anywhere; }

        #credit { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-weight: 600; font-size: 24px; letter-spacing: 0.02em; color: rgb(163 172 194 / 0.8); opacity: 0; }

        /* ===================== Scenele tipografice (fără fotografie) ===================== */

        #typo { background: radial-gradient(1200px 900px at 50% 18%, var(--navy-2) 0%, transparent 70%), linear-gradient(180deg, var(--navy-1) 0%, var(--navy-0) 100%); }

        #grid { position: absolute; left: -60px; right: -60px; top: -120px; height: 2200px; background-image: radial-gradient(rgb(201 207 221 / 0.16) 2px, transparent 2.5px); background-size: 48px 48px; }

        .scene { position: absolute; left: 72px; right: 110px; top: 300px; height: 1180px; display: flex; flex-direction: column; justify-content: center; opacity: 0; visibility: hidden; }

        .label {
            align-self: flex-start; padding: 12px 26px; border-radius: 999px;
            background: rgb(143 156 255 / 0.16); box-shadow: inset 0 0 0 2px rgb(143 156 255 / 0.45);
            color: var(--accent); font-family: var(--brand); font-weight: 700; font-size: 34px;
        }

        .kicker { font-weight: 600; font-size: 40px; color: var(--muted); }

        .title { font-family: var(--brand); font-weight: 900; line-height: 1.02; letter-spacing: -0.025em; overflow-wrap: anywhere; }

        .headline { font-family: var(--brand); font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; }

        .w { display: inline-block; }

        .rule { height: 12px; width: 220px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-strong) 100%); transform-origin: 0 50%; }

        .terminal { margin-top: 48px; border-radius: 28px; background: #050811; box-shadow: inset 0 0 0 2px rgb(201 207 221 / 0.22), 0 30px 80px rgb(0 0 0 / 0.45); overflow: hidden; }

        .terminal-bar { display: flex; gap: 12px; padding: 22px 28px; background: rgb(201 207 221 / 0.07); }

        .terminal-bar span { width: 18px; height: 18px; border-radius: 50%; background: rgb(201 207 221 / 0.35); }

        .terminal-body { padding: 34px 32px 40px; font-family: var(--mono); font-weight: 500; font-size: 40px; line-height: 1.35; overflow-wrap: anywhere; }

        .prompt { color: var(--accent); }

        .big-stars { display: flex; align-items: center; gap: 28px; margin-top: 44px; }

        .big-stars svg { width: 130px; height: 130px; }

        .big-stars div { font-family: var(--brand); font-weight: 900; font-size: 170px; line-height: 1; letter-spacing: -0.03em; }

        .note { margin-top: 36px; font-weight: 600; font-size: 32px; color: var(--muted); }

        .url { align-self: flex-start; max-width: 100%; margin-top: 52px; padding: 26px 40px; border-radius: 999px; background: linear-gradient(90deg, var(--accent-strong) 0%, #3f4bb8 100%); box-shadow: 0 20px 60px rgb(91 103 224 / 0.45); font-family: var(--mono); font-weight: 500; font-size: 40px; color: #ffffff; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div id="root" data-composition-id="root" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
        <!-- Varianta cu pagina de GitHub. -->
        <div id="stage" class="layer">
            <div id="page-blur" class="layer">
                <div id="page"></div>
            </div>
        </div>
        <div id="dim" class="layer"></div>

        <!-- Varianta tipografică. -->
        <div id="typo" class="layer">
            <div id="grid"></div>
            <div id="scenes"></div>
        </div>

        <div id="top-scrim"></div>
        <div id="band"></div>
        <div id="scroll-track"><div id="scroll-thumb"></div></div>
        <div id="cards" class="layer"></div>
        <div id="closing"></div>
        <div id="captions"></div>

        <div id="progress"></div>
        <div id="identity">
            <img id="avatar" alt="">
            <div id="repo-name"></div>
        </div>
        <div id="chapters"></div>
        <div id="credit"></div>
    </div>

    <script src="vendor/gsap.min.js"></script>
    <script>
        (function () {
            const data = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
            const scenes = Array.isArray(data.scenes) ? data.scenes : [];
            const capture = data.capture && Array.isArray(data.capture.tiles) && data.capture.tiles.length > 0 ? data.capture : null;
            const repo = data.repo || {};

            const root = document.getElementById('root');
            const total = Number(root.dataset.duration);
            const tl = gsap.timeline({ paused: true });

            /* --- Ajutoare mici pentru construirea paginii (doar textContent, niciodată innerHTML cu date). --- */

            function el(tag, className, text) {
                const node = document.createElement(tag);

                if (className) {
                    node.className = className;
                }

                if (text !== undefined && text !== null) {
                    node.textContent = String(text);
                }

                return node;
            }

            function image(src, className) {
                const node = document.createElement('img');
                node.src = src;
                node.alt = '';
                node.decoding = 'sync';

                if (className) {
                    node.className = className;
                }

                return node;
            }

            /** Micșorează fontul până când textul încape în lățimea lui și în înălțimea dată. */
            function fit(node, maxSize, minSize, maxHeight, oneLine) {
                let size = maxSize;
                node.style.fontSize = size + 'px';
                node.style.whiteSpace = oneLine ? 'nowrap' : '';

                while (size > minSize && (node.scrollWidth > node.clientWidth + 1 || node.offsetHeight > maxHeight)) {
                    size -= 2;
                    node.style.fontSize = size + 'px';
                }

                if (oneLine && node.scrollWidth > node.clientWidth + 1) {
                    node.style.whiteSpace = '';
                }
            }

            function clamp(value, low, high) {
                return Math.min(high, Math.max(low, value));
            }

            /* --- Ce e comun celor două variante: progresul, identitatea, capitolele. --- */

            function buildChrome() {
                const progress = document.getElementById('progress');
                const chapters = document.getElementById('chapters');

                scenes.forEach(function (scene) {
                    const start = Number(scene.start);
                    const duration = Number(scene.duration);

                    const segment = el('div', 'segment');
                    const fill = el('div', 'segment-fill');
                    segment.appendChild(fill);
                    progress.appendChild(segment);
                    tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: duration, ease: 'none' }, start);

                    /* Capitolul: titlul scurt al scenei (la „Ce face”, titlul ei propriu) și, când sunt mai multe, a câta e. */
                    const chapter = el('div', 'chapter');
                    chapter.appendChild(el('span', null, scene.key === 'feature' && scene.title ? scene.title : scene.label));

                    if (scene.key === 'feature' && Number(scene.count) > 1) {
                        chapter.appendChild(el('span', 'count', scene.index + '/' + scene.count));
                    }

                    chapters.appendChild(chapter);
                    tl.fromTo(chapter, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out' }, start + 0.05);
                    tl.to(chapter, { opacity: 0, duration: 0.2, ease: 'power1.in' }, start + duration - 0.2);
                });

                const name = document.getElementById('repo-name');
                name.append(el('span', 'owner', (repo.owner || '') + '/'), el('span', null, repo.name || ''));

                const avatar = document.getElementById('avatar');

                if (capture && capture.avatar) {
                    avatar.src = capture.avatar;
                } else {
                    avatar.remove();
                }

                /* Numele lung se micșorează ca să încapă pe lățimea ecranului. */
                const identity = document.getElementById('identity');
                let size = 40;

                while (size > 24 && identity.scrollWidth > 968) {
                    size -= 2;
                    name.style.fontSize = size + 'px';
                }
            }

            /* ===================== Varianta cu pagina de GitHub ===================== */

            /*
             * Câți pixeli ai video-ului are un pixel CSS al paginii: fotografia e făcută exact la lățimea
             * video-ului (400 px CSS × 2,7 = 1080 px), deci pagina se arată 1:1, fără scale.
             */
            const SCALE = capture ? Number(capture.scale) || 1080 / capture.width : 1;
            /* Unde vrem elementul pe ecran (y), între identitate și banda subtitrării; mai sus când dedesubt stă un card. */
            const FOCUS_Y = 690;
            const FOCUS_Y_WITH_CARD = 520;
            /* Marginea de sus a paginii nu coboară sub identitate; capătul ei nu urcă peste bandă. */
            const PAGE_TOP = 262;
            const PAGE_BOTTOM = 1180;

            /**
             * Unde trebuie să stea pagina (y, în pixeli întregi) ca să se vadă bine un cadru al camerei. Camera
             * se uită la „view” când cadrul are unul (rândul întreg în care stă elementul), altfel la elementul
             * însuși; lumina se pune mereu pe element. Poziția e rotunjită: oprită pe un pixel întreg, pagina
             * nu e niciodată redesenată între doi pixeli (asta ar înceţoșa textul).
             */
            function cameraFor(target, hasCard) {
                const shot = target.view ? { kind: target.kind, y: target.view.y, h: target.view.h } : target;
                const pageHeight = Math.round(capture.height * SCALE);
                let y = (hasCard ? FOCUS_Y_WITH_CARD : FOCUS_Y) - (shot.y + shot.h / 2) * SCALE;

                /* Un element mai înalt decât zona liberă se așază cu începutul sus, nu cu mijlocul. */
                if (shot.h * SCALE > (hasCard ? 520 : 780)) {
                    y = PAGE_TOP + 50 - shot.y * SCALE;
                }

                /* Deschiderea și finalul arată pagina de la capătul ei de sus. */
                if (shot.kind === 'top' || shot.kind === 'name') {
                    y = PAGE_TOP;
                }

                return { x: 0, y: Math.round(clamp(y, Math.min(PAGE_TOP, PAGE_BOTTOM - pageHeight), PAGE_TOP)) };
            }

            function buildPage() {
                const stage = document.getElementById('stage');
                const page = document.getElementById('page');
                const thumb = document.getElementById('scroll-thumb');
                const cards = document.getElementById('cards');
                const dim = document.getElementById('dim');

                document.getElementById('typo').remove();
                stage.style.background = capture.background;
                page.style.width = '1080px';
                page.style.height = Math.round(capture.height * SCALE) + 'px';

                /* Fiecare bucată la mărimea ei naturală: niciun pixel întins sau strâns. */
                capture.tiles.forEach(function (tile) {
                    const node = image(tile.file, 'tile');
                    node.style.top = Math.round(tile.y * SCALE) + 'px';
                    page.appendChild(node);
                });

                /* Bara de derulare: înălțimea ei arată cât din pagină se vede, poziția — unde suntem. */
                const TRACK = 800;
                const visibleShare = clamp((PAGE_BOTTOM - PAGE_TOP) / (capture.height * SCALE), 0.04, 1);
                thumb.style.height = Math.max(36, TRACK * visibleShare) + 'px';

                function thumbY(camera) {
                    const scrolled = clamp((PAGE_TOP - camera.y) / Math.max(1, capture.height * SCALE - (PAGE_BOTTOM - PAGE_TOP)), 0, 1);

                    return scrolled * (TRACK - Math.max(36, TRACK * visibleShare));
                }

                let current = null;

                scenes.forEach(function (scene) {
                    const start = Number(scene.start);
                    const duration = Number(scene.duration);
                    const shots = Array.isArray(scene.shots) ? scene.shots : [];
                    const card = buildCard(scene, cards);
                    const frames = [];
                    const arrivals = {};

                    shots.forEach(function (shot, position) {
                        const camera = cameraFor(shot, card !== null && card.raisesFocus);
                        /* Prima mișcare a scenei pornește cu puțin înainte de tăietură, ca pagina să fi ajuns când începe vocea. */
                        const at = position === 0 ? Math.max(0, start - 0.3) : start + Number(shot.time);

                        if (current === null) {
                            tl.set(page, { x: 0, y: camera.y }, 0);
                            tl.set(thumb, { y: thumbY(camera) }, 0);
                        } else if (camera.y !== current.y) {
                            const distance = Math.abs(camera.y - current.y);
                            const travel = clamp(0.55 + distance / 9000, 0.6, 1.25);
                            tl.to(page, { y: camera.y, duration: travel, ease: 'power3.inOut' }, at);
                            tl.to(thumb, { y: thumbY(camera), duration: travel, ease: 'power3.inOut' }, at);
                            camera.arrives = at + travel;

                            /* O derulare lungă se vede ca un „flick” pe telefon: pagina se estompează cât zboară, apoi filtrul dispare de tot. */
                            if (distance > 2600) {
                                const blur = clamp(distance / 900, 3, 12);
                                tl.to(stage, { filter: 'blur(' + blur + 'px)', duration: travel * 0.42, ease: 'power2.in' }, at);
                                tl.to(stage, { filter: 'blur(0px)', duration: travel * 0.42, ease: 'power2.out' }, at + travel * 0.58);
                                tl.set(stage, { filter: 'none' }, at + travel);
                            }
                        } else {
                            camera.arrives = at + 0.2;
                        }

                        camera.arrives = camera.arrives || 0.25;
                        arrivals[shot.kind] = arrivals[shot.kind] === undefined ? camera.arrives : arrivals[shot.kind];
                        arrivals.first = arrivals.first === undefined ? camera.arrives : arrivals.first;
                        current = camera;

                        if (shot.framed) {
                            /* Rama, în pixelii video-ului: elementul și o margine de câțiva pixeli în jurul lui. */
                            const pad = shot.kind === 'files' || shot.kind === 'image' || shot.kind === 'logo' ? 10 : 18;
                            const frame = el('div', 'frame');
                            frame.style.left = Math.round(shot.x * SCALE - pad) + 'px';
                            frame.style.top = Math.round(shot.y * SCALE - pad) + 'px';
                            frame.style.width = Math.round(shot.w * SCALE + pad * 2) + 'px';
                            frame.style.height = Math.round(shot.h * SCALE + pad * 2) + 'px';
                            page.appendChild(frame);

                            /* Rama apare când camera aproape a ajuns și dispare când pleacă spre următorul cadru. */
                            const shown = Math.max(0, camera.arrives - 0.22);
                            tl.fromTo(frame, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, shown);
                            frames.push({ node: frame, shown: shown });
                        }
                    });

                    /* Fiecare ramă stă până pornește următoarea mișcare a camerei (sau până la sfârșitul scenei). */
                    frames.forEach(function (frame, position) {
                        const next = position + 1 < frames.length ? frames[position + 1].shown - 0.5 : start + duration - 0.32;
                        tl.to(frame.node, { opacity: 0, duration: 0.18, ease: 'power1.in' }, Math.max(frame.shown + 0.4, next));
                    });

                    if (card) {
                        /* Cardul apare după ce camera a ajuns la elementul lui, nu în timpul derulării. */
                        const arrival = arrivals[card.after] === undefined ? arrivals.first : arrivals[card.after];
                        const shownAt = Math.max(start + 0.15, (arrival === undefined ? start : arrival) - 0.1);
                        tl.fromTo(card.node, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, shownAt);
                        tl.to(card.node, { opacity: 0, y: 20, duration: 0.22, ease: 'power1.in' }, start + duration - 0.25);
                    }

                    if (scene.key === 'cta') {
                        buildClosing(scene, start, duration, dim);
                    }

                    buildCaptions(scene);
                });
            }

            /**
             * Cardul unei scene, când are date care nu sunt pe pagina de GitHub: limbajele și modulele din
             * analiza codului („Cum e construit”), cifrele istoricului („În cifre”), comanda — doar când
             * blocul ei de cod nu a fost găsit pe pagină.
             */
            function buildCard(scene, parent) {
                const shots = Array.isArray(scene.shots) ? scene.shots : [];
                let node = null;
                let after = 'first';

                /* Limbajele le arată pagina (bara GitHub); cardul adaugă doar ce știe GitChronicle: modulele mari. */
                if (scene.key === 'built' && Array.isArray(scene.modules) && scene.modules.length > 0) {
                    node = el('div', 'card');
                    const modules = el('div', 'modules');
                    scene.modules.forEach(function (path) { modules.appendChild(el('span', null, path)); });
                    node.appendChild(modules);
                }

                if (scene.key === 'proof' && Array.isArray(scene.stats) && scene.stats.length > 0) {
                    node = el('div', 'card');
                    const stats = el('div', 'stats');
                    scene.stats.forEach(function (stat) {
                        const box = el('div', 'stat');
                        box.append(el('div', 'stat-value', stat.value), el('div', 'stat-label', stat.label));
                        stats.appendChild(box);
                    });
                    node.appendChild(stats);
                    /* Cardul apare când vocea ajunge la istoricul git (cadrul cu ultimul commit). */
                    after = 'commit';
                }

                if (scene.key === 'start' && scene.command && shots.filter(function (shot) { return shot.kind === 'command'; }).length === 0) {
                    node = el('div', 'card');
                    const body = el('div', 'terminal-body');
                    body.style.padding = '0';
                    body.append(el('span', 'prompt', '$ '), el('span', null, scene.command));
                    node.appendChild(body);
                }

                if (node === null) {
                    return null;
                }

                if (scene.note) {
                    node.appendChild(el('div', 'card-note', scene.note));
                }

                parent.appendChild(node);
                node.querySelectorAll('.stat-value').forEach(function (value) { fit(value, 68, 34, 80, true); });
                /* Cardul stă lipit de banda subtitrării; elementul încadrat rămâne liber deasupra lui. */
                node.style.top = (1150 - node.offsetHeight) + 'px';

                return { node: node, after: after, raisesFocus: true };
            }

            /**
             * Finalul: pagina se întunecă și rămâne repository-ul. Imaginea lui: previzualizarea pusă de
             * proprietar, altfel logo-ul din README, altfel cardul generat de GitHub. Apoi avatarul, numele și
             * adresa; jos, mic, mențiunea GitChronicle.
             */
            function buildClosing(scene, start, duration, dim) {
                const closing = document.getElementById('closing');
                const hero = capture.social && capture.social_custom ? capture.social : (capture.logo || capture.social);

                if (hero) {
                    closing.appendChild(image(hero, 'hero'));
                }

                const where = el('div', 'where');
                const text = el('div');
                text.append(el('b', null, repo.name || ''), el('span', null, scene.url));

                if (capture.avatar) {
                    where.appendChild(image(capture.avatar));
                }

                where.appendChild(text);
                closing.appendChild(where);

                if (!hero) {
                    closing.style.top = '620px';
                }

                const credit = document.getElementById('credit');
                credit.textContent = scene.credit || '';

                tl.to(dim, { opacity: 1, duration: 0.5, ease: 'power2.out' }, start + 0.35);
                tl.to('#page-blur', { filter: 'blur(6px)', duration: 0.5, ease: 'power2.out' }, start + 0.9);
                tl.fromTo(closing, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, start + 0.45);
                tl.fromTo(credit, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, start + 1.1);
            }

            /** Subtitrarea unei scene: fiecare frază stă pe ecran cât e rostită, cu cuvântul curent în galben. */
            function buildCaptions(scene) {
                const container = document.getElementById('captions');
                const cues = Array.isArray(scene.cues) ? scene.cues : [];
                const sceneEnd = Number(scene.start) + Number(scene.duration);

                cues.forEach(function (cue, position) {
                    const node = el('div', 'cue');
                    const words = (cue.words || []).map(function (word) {
                        const span = el('span', 'word', word.text);
                        node.appendChild(span);

                        return span;
                    });
                    container.appendChild(node);

                    /* O frază lungă se micșorează ca să rămână pe cel mult două rânduri. */
                    let size = 74;

                    while (size > 50 && node.scrollHeight > 200) {
                        size -= 4;
                        node.style.fontSize = size + 'px';
                    }

                    const from = Number(cue.start);
                    const until = position + 1 < cues.length ? Number(cues[position + 1].start) : Math.min(sceneEnd - 0.05, Number(cue.end) + 0.3);

                    tl.fromTo(node, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.12, ease: 'power2.out' }, from);
                    tl.set(node, { opacity: 0 }, until);

                    (cue.words || []).forEach(function (word, index) {
                        tl.set(words[index], { color: '#ffd33d' }, Number(word.start));

                        if (index + 1 < words.length) {
                            tl.set(words[index], { color: '#f3f5fb' }, Number(cue.words[index + 1].start));
                        }
                    });
                });
            }

            /* ===================== Varianta tipografică ===================== */

            function words(className, text) {
                const node = el('div', className);

                String(text || '').split(/\s+/).filter(Boolean).forEach(function (word, index) {
                    if (index > 0) {
                        node.appendChild(document.createTextNode(' '));
                    }

                    node.appendChild(el('span', 'w', word));
                });

                return node;
            }

            function wordsIn(node, at) {
                tl.fromTo(node.querySelectorAll('.w'), { y: -30, opacity: 0, filter: 'blur(6px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out', stagger: 0.05 }, at);
            }

            function popIn(node, at) {
                tl.fromTo(node, { scale: 0.7, opacity: 0, transformOrigin: '0% 50%' }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.6)' }, at);
            }

            function starIcon() {
                const ns = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(ns, 'svg');
                svg.setAttribute('viewBox', '0 0 24 24');
                const path = document.createElementNS(ns, 'path');
                path.setAttribute('d', 'M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 17.52l-5.88 3.09 1.12-6.55L2.48 9.42l6.58-.96z');
                path.setAttribute('fill', '#ffd33d');
                svg.appendChild(path);

                return svg;
            }

            /** Numerele mari ca pe GitHub: 1,234, apoi 12.3k și 82k. */
            function compact(value) {
                if (value >= 100000) {
                    return Math.round(value / 1000) + 'k';
                }

                if (value >= 10000) {
                    return (Math.round(value / 100) / 10) + 'k';
                }

                return Math.round(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }

            const builders = {
                hook: function (scene, box) {
                    const kicker = el('div', 'kicker', scene.kicker);
                    const title = el('div', 'title', scene.title);
                    const rule = el('div', 'rule');
                    rule.style.margin = '40px 0 48px';
                    box.append(kicker, title, rule);
                    fit(title, 170, 84, 400, true);
                    let text = null;

                    if (scene.text) {
                        text = words('headline', scene.text);
                        box.append(text);
                        fit(text, 84, 46, 560);
                    }

                    return function (t) {
                        /* Pe primul cadru numele e deja pe ecran: e și miniatura video-ului. */
                        tl.fromTo(title, { scale: 1.06, transformOrigin: '0% 50%' }, { scale: 1, duration: 0.8, ease: 'expo.out' }, t);
                        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.out' }, t + 0.2);

                        if (text) {
                            wordsIn(text, t + 0.45);
                        }
                    };
                },

                text: function (scene, box) {
                    const label = el('div', 'label', scene.key === 'feature' && scene.title ? scene.title : scene.label);
                    const text = words('headline', scene.text);
                    text.style.marginTop = '44px';
                    box.append(label, text);
                    fit(text, 88, 44, 760);

                    return function (t) {
                        popIn(label, t + 0.05);
                        wordsIn(text, t + 0.3);
                    };
                },

                built: function (scene, box) {
                    const label = el('div', 'label', scene.label);
                    const text = words('headline', scene.text);
                    text.style.marginTop = '44px';
                    const chips = el('div', 'chips');
                    chips.style.marginTop = '44px';
                    (scene.chips || []).forEach(function (chip) { chips.appendChild(el('div', 'chip', chip)); });
                    box.append(label, text, chips);

                    if (scene.note) {
                        box.append(el('div', 'note', scene.note));
                    }

                    fit(text, 76, 44, 520);

                    return function (t) {
                        popIn(label, t + 0.05);
                        wordsIn(text, t + 0.3);
                        tl.fromTo(chips.children, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.5)', stagger: 0.09 }, t + 0.7);
                    };
                },

                proof: function (scene, box) {
                    const label = el('div', 'label', scene.label);
                    box.append(label);
                    let count = null;

                    if (typeof scene.stars === 'number') {
                        const stars = el('div', 'big-stars');
                        count = el('div', null, compact(scene.stars));
                        stars.append(starIcon(), count);
                        box.append(stars);
                    }

                    const stats = el('div', 'stats');
                    stats.style.marginTop = '52px';
                    (scene.stats || []).forEach(function (stat) {
                        const item = el('div', 'stat');
                        item.append(el('div', 'stat-value', stat.value), el('div', 'stat-label', stat.label));
                        stats.appendChild(item);
                    });
                    box.append(stats);
                    stats.querySelectorAll('.stat-value').forEach(function (value) { fit(value, 68, 34, 80, true); });

                    const chips = el('div', 'chips');
                    chips.style.marginTop = '48px';
                    (scene.chips || []).forEach(function (chip) { chips.appendChild(el('div', 'chip', chip)); });
                    box.append(chips);

                    return function (t) {
                        popIn(label, t + 0.05);

                        if (count) {
                            tl.fromTo(count.parentNode, { scale: 0.7, opacity: 0, transformOrigin: '0% 50%' }, { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.6)' }, t + 0.15);
                        }

                        tl.fromTo(stats.children, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out', stagger: 0.1 }, t + 0.45);
                        tl.fromTo(chips.children, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.5)', stagger: 0.09 }, t + 0.8);
                    };
                },

                start: function (scene, box) {
                    const label = el('div', 'label', scene.label);
                    const text = words('headline', scene.text);
                    text.style.marginTop = '40px';
                    const terminal = el('div', 'terminal');
                    const bar = el('div', 'terminal-bar');
                    bar.append(el('span'), el('span'), el('span'));
                    const body = el('div', 'terminal-body');
                    body.append(el('span', 'prompt', '$ '), el('span', null, scene.command));
                    terminal.append(bar, body);
                    box.append(label, text, terminal);
                    fit(text, 76, 44, 420);
                    fit(body, 42, 28, 320);

                    return function (t) {
                        popIn(label, t + 0.05);
                        wordsIn(text, t + 0.25);
                        tl.fromTo(terminal, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, t + 0.6);
                    };
                },

                cta: function (scene, box) {
                    const text = words('headline', scene.text);
                    const url = el('div', 'url', scene.url);
                    box.append(text, url);
                    fit(text, 84, 46, 620);
                    fit(url, 40, 28, 220, true);

                    const credit = document.getElementById('credit');
                    credit.textContent = scene.credit || '';

                    return function (t) {
                        wordsIn(text, t + 0.1);
                        tl.fromTo(url, { scale: 0.85, opacity: 0, transformOrigin: '0% 50%' }, { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(1.7)' }, t + 0.8);
                        tl.fromTo(credit, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, t + 1.1);
                    };
                },
            };

            builders.problem = builders.text;
            builders.feature = builders.text;

            function buildTypographic() {
                ['stage', 'dim', 'band', 'scroll-track', 'cards', 'closing', 'captions', 'top-scrim', 'chapters'].forEach(function (id) {
                    document.getElementById(id).remove();
                });

                const container = document.getElementById('scenes');

                scenes.forEach(function (scene, position) {
                    const build = builders[scene.key];

                    if (!build) {
                        return;
                    }

                    const box = el('section', 'scene');
                    container.appendChild(box);
                    const animate = build(scene, box);
                    const start = Number(scene.start);
                    const duration = Number(scene.duration);

                    /* Scena e vizibilă doar în intervalul ei; prima e pe ecran din primul cadru. */
                    tl.set(box, { autoAlpha: 1 }, start);
                    tl.set(box, { autoAlpha: 0 }, start + duration);
                    tl.fromTo(box, { scale: position === 0 ? 1 : 1.05 }, { scale: 1, duration: 0.5, ease: 'expo.out' }, start);
                    animate(start, duration);
                });

                tl.fromTo('#grid', { y: 0 }, { y: 96, duration: total, ease: 'none' }, 0);
            }

            /* --- Construirea video-ului, după ce s-au încărcat fonturile și imaginile (măsurăm textele cu fontul lor). --- */

            const fontsToLoad = [
                '900 100px "Mona Sans"', '700 100px "Mona Sans"',
                '600 100px "Instrument Sans"', '400 100px "Instrument Sans"', '500 100px "JetBrains Mono"',
            ];

            Promise.all(fontsToLoad.map(function (font) { return document.fonts.load(font, 'AaĂăÂâÎîȘșȚț'); })).then(function () {
                buildChrome();

                if (capture) {
                    buildPage();
                } else {
                    buildTypographic();
                }

                /* Timeline-ul se predă abia după ce toate imaginile (bucățile paginii, avatarul) s-au încărcat. */
                const pending = Array.prototype.slice.call(document.images).filter(function (node) { return !node.complete; });

                return Promise.all(pending.map(function (node) {
                    return new Promise(function (resolve) { node.onload = resolve; node.onerror = resolve; });
                }));
            }).then(function () {
                /* O clipă în plus la capăt, ca ultimul cadru să aibă o stare definită. */
                tl.to({}, { duration: 0.001 }, Math.max(0, total - 0.001));

                window.__timelines = window.__timelines || {};
                window.__timelines.root = tl;
            });
        })();
    </script>
</body>
