# Secrets written straight into the code, in any text file. The message never repeats the secret it found:
# the report shows only the file and the line. Written for GitChronicle (the project's license).
rules:
  - id: secret-private-key
    languages: [regex]
    severity: ERROR
    message: The file holds a private key. Anyone with access to the repository can use it; remove it, replace it with a new one and keep it outside the code.
    metadata:
      title: Private key in the repository
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    pattern-regex: -----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----

  - id: secret-aws-access-key
    languages: [regex]
    severity: ERROR
    message: The file seems to hold an AWS access key. Deactivate it in the AWS console and read the key from environment variables.
    metadata:
      title: AWS access key in the code
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b

  - id: secret-github-token
    languages: [regex]
    severity: ERROR
    message: The file seems to hold a GitHub token. Revoke it in the GitHub settings and read it from environment variables.
    metadata:
      title: GitHub token in the code
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    pattern-regex: \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b
